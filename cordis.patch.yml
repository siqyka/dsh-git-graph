# dsh bundle layer: mount the git-graph plugin (server half: index.js;
# client half: client.js served by dsh-client-modules under /plugins).
#
# 仓库白名单（可选）：不配置时插件仍可用 —— 会话工作区自动发现 +
# 图谱页面「📂 打开文件夹」添加的仓库都可直接访问。
# 如需固定白名单，取消注释并改成你自己的仓库路径：
#
#   config:
#     repo: "C:/path/to/your/repo"        # 单个仓库
#     # repos:                            # 或多个仓库
#     #   - "C:/path/to/repo-a"
#     #   - "C:/path/to/repo-b"
#
# `name` MUST be the full npm package name (scoped). The loader resolves the row
# through Node (`exactPackageSpecifier` + require.resolve) to locate the package
# manifest, and only then reads `dsh.client` to bring in the browser half. A bare
# "dsh-git-graph" resolves to nothing here — the published package is scoped — so
# the row never mounts and the tab silently never appears.
- insert:
    - id: git-graph
      name: '@shiqyka/dsh-git-graph'
